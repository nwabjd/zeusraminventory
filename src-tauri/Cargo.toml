[package]
name = "zeus-ram-inventory"
version = "1.0.0"
description = "ZEUS - RAM Inventory Management Desktop Application"
authors = ["ZEUS Business"]
edition = "2021"

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "zeus_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
rusqlite = { version = "0.37", features = ["bundled", "backup", "functions"] }

[features]
# Managed by the Tauri CLI: `tauri build` enables it so the app serves the embedded
# production frontend instead of the dev server URL (dev mode = !custom-protocol).
# Required by tauri's build.rs: custom_protocol = has_feature("custom-protocol").
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true
