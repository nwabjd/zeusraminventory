# Supabase local dev config: https://supabase.com/docs/reference/cli/config
# `supabase start` spins up a local Postgres + Auth so the ZEUS migrations and
# policies can be exercised before pointing at a hosted project.

project_id = "zeus-ram-inventory"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]

[db]
port = 54322
major_version = 15

[studio]
enabled = true
port = 54323

[inbucket]
enabled = false

[auth]
enabled = true
site_url = "http://localhost:1420"
additional_redirect_urls = ["http://tauri.localhost"]

[auth.external.google]
enabled = true
client_id = ""
client_secret = ""

[realtime]
enabled = true